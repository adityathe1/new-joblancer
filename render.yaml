# FREE TEST DEPLOYMENT: no disk, data resets on every restart. Demo jobs are added automatically.
# For real users, replace this file with render.paid.yaml (keeps the database on a disk).
services:
  - type: web
    name: joblancer
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /tmp/joblancer.db
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "1"
      - key: PAYMENTS
        value: mock
      - key: ALLOW_MOCK_PAYMENTS
        value: "1"
      - key: DEV_OTP
        value: "1"
      - key: PAN_AUTO_APPROVE
        value: "1"
